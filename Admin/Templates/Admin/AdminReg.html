<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" method="post">
        {% csrf_token %}
        <table border="2" align="center">
            <tr>
                <td>NAME</td>
                <td><input type="text" name="txt_name" id=""></td>
            </tr>
            <tr>
                <td>EMAIL</td>
                <td><input type="text"  id="txt_email" required  name="txt_email" placeholder="username@gmail.com" pattern="^[^\s@]+@gmail\.com$" title="Please enter a valid Gmail address (e.g., example@gmail.com)."></td>
            </tr>
            <tr>
                <td>PASSWORD</td>
                <td><input type="text" name="txt_password" id=""></td>
            </tr>
            
            <tr>
               
                <td colspan="2"><input type="submit"   value="Submit"></td>
            </tr>
            
        </table>
    </form>
    <table border="2" align="center">
        <tr>
        <th>#</th>
        <th>Name</th>
        <th>Email</th>
        <th>Password</th>
        <th>Action</th>
    </tr>
    {% for i in result %}
    <tr>
        <td>{{forloop.counter}}</td>
        <td>{{i.adminreg_name}}</td>
        <td>{{i.adminreg_email}}</td>
        <td>{{i.adminreg_password}}</td>

        <td><a href="{% url 'Admin:deladmin' i.id %}">Delete</a></td>
    </tr>
    {% endfor %}
    </table>
</body>
</html>
