{% extends 'Admin/Head.html' %}
{% block content %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" method="post">
        {% csrf_token %}
        <table border="2" align="center">
            <tr>
                <td>Brand</td>
                <td><input type="text" name="txt_dis" value="{{r.brand_name}}" id=""></td>
            </tr>
            
            <tr>
               
                <td colspan="2"><input type="submit"   value="Add"></td>
            </tr>
            
        </table>
    </form>
    <table border="2" align="center">
        <tr>
        <th>#</th>
        <th>Brand</th>
        <th>Action</th>
    </tr>
    {% for i in result %}
    <tr>
        <td>{{forloop.counter}}</td>
        <td>{{i.brand_name}}</td>
        <td><a href="{% url 'Admin:delbran' i.id %}">Delete</a>
        <a href="{% url 'Admin:editbran' i.id %}">Edit</a></td>
    </tr>
    {% endfor %}
    </table>
    
</body>
</html>
{% endblock content %}
