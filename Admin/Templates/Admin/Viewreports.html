{% extends 'Admin/Head.html' %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Basic styling for the body */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        /* Styling for table */
        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border: 1px solid #ddd;
        }

        th {
            background-color: #6cc7e3;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: #ddd;
        }

        /* Styling for form container */
        form {
            width: 80%;
            margin: 20px auto;
        }

        /* Optional: Styling for the header */
        h2 {
            text-align: center;
            color: #333;
            font-size: 24px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h2> Reports </h2>
    
    <form action="" method="post">
        {% csrf_token %}
        <table border="2" align="center">
            <tr>
                <th>#</th>
                <th>Description</th>
                <th>Asha Worker</th>
                <th>Date</th>
            </tr>
            {% for i in result %}
            <tr>
                <td>{{forloop.counter}}</td>
                <td>{{i.report_des}}</td>
                <td>{{i.asha.asha_name}}</td>
                <td>{{i.report_date}}</td>
            </tr>
            {% endfor %}
        </table>
    </form>

</body>
</html>

{% endblock content %}
