{% extends 'Admin/Head.html' %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reply</title>
    <style>
        /* Basic styling for the body */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        /* Centering the form */
        form {
            width: 60%;
            margin: 40px auto;
            background-color: white;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }

        /* Styling for the table inside the form */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border: 1px solid #ddd;
        }

        td {
            background-color: #f9f9f9;
        }

        th {
            background-color: #1e0137;
            color: white;
        }

        /* Styling for the input fields */
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }

        input[type="submit"] {
            width: 100%;
            padding: 12px;
            background-color: #2f0358;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }

        input[type="submit"]:hover {
            background-color: #45a049;
        }

        /* Optional: Styling for the heading */
        h2 {
            text-align: center;
            color: #333;
            font-size: 24px;
            margin-top: 20px;
        }

    </style>
</head>
<body>

    <h2>Reply to Complaint</h2>

    <form action="" method="post">
        {% csrf_token %}
        <table border="2" align="center">
            <tr>
                <td>Reply</td>
                <td><input type="text" name="reply" required></td>
            </tr>
            <tr>
                <td colspan="2"><input type="submit" value="Add Reply"></td>
            </tr>
        </table>
    </form>

</body>
</html>

{% endblock content %}
