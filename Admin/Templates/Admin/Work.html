{% extends 'Admin/Head.html' %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work</title>
    <style>
        /* Basic styling for the body */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        /* Styling for form table */
        table {
            width: 50%;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border: 1px solid #ddd;
        }

        th {
            background-color: #03a9f7;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: #ddd;
        }

        /* Styling for input fields */
        input[type="text"] {
            width: 100%;
            padding: 8px;
            margin: 10px 0;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        input[type="submit"] {
            background-color: #fa0d25;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }

        input[type="submit"]:hover {
            background-color: #45a049;
        }

        /* Styling for the action links */
        table a {
            color: #4CAF50;
            text-decoration: none;
        }

        table a:hover {
            text-decoration: underline;
        }
        h2 {
            text-align: center;
            color: #333;
            font-size: 24px;
            margin-top: 20px;
        }

    </style>
</head>
<body>

    <h2>Work Table</h2>
    <form action="" method="post">
        {% csrf_token %}
        <table border="2" align="center">
            <tr>
                <td>Work</td>
                <td><input type="text" name="txt_work" id="" required></td>
            </tr>
            <tr>
                <td colspan="2"><input type="submit" value="Add"></td>
            </tr>
        </table>
    </form>

    <table border="2" align="center">
        <tr>
            <th>#</th>
            <th>Work</th>
            <th>Action</th>
        </tr>
        {% for i in result %}
        <tr>
            <td>{{forloop.counter}}</td>
            <td>{{i.work_des}} </td>
            
            
            <td><a href="{% url 'Admin:delwork' i.id  id %}">Delete</a></td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>

{% endblock content %}
