<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" method="post">
        {% csrf_token %}
        <table border="2" align="center">
            <tr>
                <td>Category</td>
                <td><input type="text" name="txt_cat" id=""></td>
            </tr>
            
            <tr>
               
                <td colspan="2"><input type="submit"   value="Add"></td>
            </tr>
            
        </table>
    </form>
    <table border="2" align="center">
        <tr>
        <th>#</th>
        <th>Category</th>
        <th>Action</th>
    </tr>
    {% for i in result %}
    <tr>
        <td>{{forloop.counter}}</td>
        <td>{{i.category_name}}</td>
        <td><a href="{% url 'Admin:delcat' i.id %}">Delete</a></td>

    </tr>
    {% endfor %}
    </table>

    
</body>
</html>
