{% extends 'Admin/Head.html' %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification</title>
    <style>
        /* Basic styling for the body */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        /* Styling for form table */
        table {
            width: 50%;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border: 1px solid #ddd;
        }

        th {
            background-color: #fb1706;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: #ddd;
        }

        /* Styling for select and input fields */
        select, input[type="text"] {
            width: 100%;
            padding: 8px;
            margin: 10px 0;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        /* Styling for submit button */
        input[type="submit"] {
            background-color: #ec0dc3;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }

        input[type="submit"]:hover {
            background-color: #45a049;
        }

        /* Styling for the action links */
        table a {
            color: #4CAF50;
            text-decoration: none;
            padding: 5px;
        }

        table a:hover {
            text-decoration: underline;
        }

        /* Styling for the action links container */
        td a {
            margin-right: 10px;
        }

        /* Header text styling */
        h2 {
            text-align: center;
            color: #333;
        }
    </style>
</head>
<body>
    <h2>Notification Form</h2>
    <form action="" method="post">
        {% csrf_token %}
        <table border="2" align="center">
            <tr>
                <th>Panchayath</th>
                <td>
                    <select name="sel_panchayath">
                        {% for i in result %}
                        <option {% if i.id == rr.panchayath.id %}selected{% endif %}value="{{i.id}}">{{i.panchayath_name}}</option>
                        {% endfor %}
                    </select> 
                </td>
            </tr>
            <tr>
                <td>Description</td>
                <td><input type="text" name="txt_des" id="" required></td>
            </tr>
            <tr>
                <td colspan="2"><input type="submit" value="submit"></td>
            </tr>
        </table>
    </form>

    <table border="2" align="center">
        <tr>
            <th>#</th>
            <th>Panchayath</th>
            <th>Description</th>
            <th>Action</th>
        </tr>
        {% for i in r %}
        <tr>
            <td>{{forloop.counter}}</td>
            <td>{{i.panchayath.panchayath_name}}</td>
            <td>{{i.notification_des}}</td>
            <td>
                <a href="{% url 'Admin:delnoti' i.id %}">delete</a>
                <a href="{% url 'Admin:editnoti' i.id %}">edit</a>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>

{% endblock content %}
