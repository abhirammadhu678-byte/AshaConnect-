{% extends 'Ashaworker/Header.html' %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaccine</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
        }

        form {
            background-color: #ffffff;
            max-width: 600px;
            margin: 30px auto;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 10px 15px;
            border: 1px solid #cbd5e1;
            text-align: center;
        }

        th {
            background-color: #e2e8f0;
            color: #1e293b;
        }

        select, input[type="text"], input[type="date"] {
            width: 100%;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #94a3b8;
        }

        input[type="submit"] {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            margin-top: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        input[type="submit"]:hover {
            background-color: #1d4ed8;
        }

        .vaccine-table {
            max-width: 800px;
            margin: 0 auto;
            margin-top: 40px;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            overflow-x: auto;
        }
    </style>
</head>
<body>

    <h1>Newborn Vaccination Form</h1>

    <form action="" method="post">
        {% csrf_token %}
        <table>
            <tr>
                <th>Vaccine</th>
                <td>
                    <select name="sel_vaccine" required>
                        {% for i in vaccine %}
                        <option value="{{i.id}}">{{i.vaccine_name}}</option> 
                        {% endfor %}
                    </select>
                </td>
            </tr>
            <tr>
                <th>Date</th>
                <td><input type="date" name="vaccine_date" required></td>
            </tr>
            <tr>
                <td colspan="2"><input type="submit" value="Submit"></td>
            </tr>
        </table>
    </form>

    <div class="vaccine-table">
        <table>
            <tr>
                <th>#</th>
                <th>Vaccine</th>
                <th>Date</th>
                <!-- <th>Action</th> -->
            </tr>
            {% for i in vaccinedetails %}
            <tr>
                <td>{{ forloop.counter }}</td>
                <td>{{ i.vaccine.vaccine_name }}</td>
                <td>{{ i.vaccine_date }}</td>
                <!-- <td><a href="{% url 'Admin:delnoti' i.id %}">Delete</a></td> -->
            </tr>
            {% endfor %}
        </table>
    </div>

</body>
</html>

{% endblock %}
