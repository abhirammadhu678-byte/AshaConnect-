{% extends 'Ashaworker/Header.html' %}
{% block content %}<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Pregnant Women</title>
    <style>
        /* Global styles */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 80%;
            margin: 30px auto;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        table {
            width: 100%;
            margin: 20px 0;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border: 1px solid #ddd;
        }

        th {
            background-color: #4CAF50;
            color: white;
            font-weight: bold;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: #e0e0e0;
        }

        select {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
            width: 100%;
        }

        input[type="submit"]:hover {
            background-color: #45a049;
        }

        a {
            color: red;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>Add Pregnant Women</h1>
        <form action="" method="post">
            {% csrf_token %}
            <table>
                <tr>
                    <th>House</th>
                    <td>
                        <select name="sel_house" id="sel_house">
                            {% for i in house %}
                            <option value="{{ i.id }}">{{ i.house_number }}</option>
                            {% endfor %}
                        </select>
                    </td>
                </tr>
                <tr>
                    <th>Member</th>
                    <td><select name="sel_member" id="sel_member">
                        <option value="">---select----</option>
                    </select></td>
                </tr>
                <tr>
                    <td colspan="2"><input type="submit" value="Submit"></td>
                </tr>
            </table>
        </form>

        <table>
            <tr>
                <th>#</th>
                <th>Member</th>
                <th>Action</th>
            </tr>
            {% for i in result %}
            <tr>
                <td>{{ forloop.counter }}</td>
                <td>{{ i.member_wife.member_name }}</td>
                <td><a href="{% url 'Ashaworker:addvaccine' i.id %}">Add Vaccination</a></td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>


<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script>
    $("#sel_house").change(function () {
        var did = $(this).val();
        var ur = "{% url 'Ashaworker:ajaxwife' %}";
        $.ajax({
            url: ur,
            data: { did: did },
            success: function (data) {
                $("#sel_member").html(data);
            },
        });
    });
</script>


{% endblock %}
