{% extends 'Ashaworker/Header.html' %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <style>
        /* Global styles */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 50%;
            margin: 30px auto;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        td {
            padding: 12px;
            text-align: left;
            border: 1px solid #ddd;
        }

        input[type="text"], input[type="email"] {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #45a049;
        }

        /* Table styling */
        th {
            background-color: #4CAF50;
            color: white;
            font-weight: bold;
        }

        /* Styling for the form's submit button */
        tr {
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Edit Profile</h1>
        <form method="post">
            {% csrf_token %}
            <table>
                <tr>
                    <td><strong>Name:</strong></td>
                    <td><input type="text" name="txt_name" value="{{ Ashaworker.asha_name }}"></td>
                </tr>
                <tr>
                    <td><strong>Email:</strong></td>
                    <td><input type="email" name="txt_email" value="{{ Ashaworker.asha_email }}"></td>
                </tr>
                <tr>
                    <td><strong>Contact:</strong></td>
                    <td><input type="text" name="txt_contact" value="{{ Ashaworker.asha_contact }}"></td>
                </tr>
                <tr>
                    <td colspan="2"><input type="submit" value="Edit"></td>
                </tr>
            </table>
        </form>
    </div>
</body>
</html>

{% endblock %}
