{% extends 'Ashaworker/Header.html' %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS for additional styling (Optional) -->
    <style>
        body {
            background-color: #f4f4f9;
        }

        .form-container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .table-container {
            margin-top: 30px;
        }

        .table th, .table td {
            text-align: center;
        }

        .table th {
            background-color: #6f4caf;
            color: white;
        }

        .btn-custom {
            color: white;
            background-color: #1b68b9;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            text-decoration: none;
        }

        .btn-custom:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <div class="container my-5">
        <!-- Form to Add House Information -->
        <div class="form-container mb-4">
            <h4>Add House Information</h4>
            <form action="" method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="house_number" class="form-label">House Number</label>
                    <input type="text" class="form-control" name="txt_house" id="house_number" required>
                </div>
                <div class="mb-3">
                    <label for="house_address" class="form-label">Address</label>
                    <textarea class="form-control" name="txt_address" id="house_address" rows="3" required></textarea>
                </div>
                <div class="mb-3">
                    <label for="person_count" class="form-label">Person Count</label>
                    <input type="text" class="form-control" name="txt_count" id="person_count" required>
                </div>
                <button type="submit" class="btn btn-primary">Add</button>
            </form>
        </div>

        <!-- Display House Information Table -->
        <div class="table-container">
            <table class="table table-bordered table-striped">
                <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>House Number</th>
                        <th>Address</th>
                        <th>Count</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    {% for i in result %}
                    <tr>
                        <td>{{ forloop.counter }}</td>
                        <td>{{ i.house_number }}</td>
                        <td>{{ i.house_address }}</td>
                        <td>{{ i.house_count }}</td>
                        <td><a href="{% url 'Ashaworker:addmem' i.id %}" class="btn-custom">Add Member</a></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <!-- Bootstrap JS and Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>

</body>
</html>
{% endblock %}
