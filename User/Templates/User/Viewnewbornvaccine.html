<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Newborn Vaccination</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f9;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 30px auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #4CAF50;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Newborn Vaccination Records</h1>
        <form action="" method="post">
            {% csrf_token %}
            <table>
                <tr>
                    <th>#</th>
                    <th>Vaccine</th>
                    <th>Date</th>
                </tr>
                {% for i in result %}
                <tr>
                    <td>{{ forloop.counter }}</td>
                    <td>{{ i.vaccine.vaccine_name }}</td>
                    <td>{{ i.vaccine_date }}</td>
                </tr>
                {% endfor %}
            </table>
        </form>
    </div>
</body>
</html>
