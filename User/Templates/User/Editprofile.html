<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
</head>
<body><form method="post">
    {% csrf_token %}
    <table border="1" align="center">
        <tr>
            <td>Name:</td>
            <td><input type="text" name="user_name" value={{user.user_name}}></td>
        </tr>
        <tr>
            <td>Email:</td>
            <td><input type="email" name="user_email" value={{user.user_email}}></td>
        </tr>
        <tr>
            <td>Contact:</td>
            <td><input type="text" name="user_contact" value={{user.user_contact}}></td>
        </tr>
        <tr>
            <td>Address:</td>
            <td><input type="text" name="user_address" id="user.user_address" value={{user.user_address}} /></td>
        </tr>
        <tr align="center">
            <td colspan="2"><input type="submit" value="Edit"></td>
        </tr>
    </table>
</form>
</body>
</html>
